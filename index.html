<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omanshu Bhatt — AI/ML & Full-Stack Developer</title>
    <link rel="preload" href="./3D.glb" as="fetch" crossorigin="anonymous" />

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
       
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            transition: background 0.5s ease, color 0.5s ease;
        }

       
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

      
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #ffffff;
            color: #111111;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loading-title {
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .loading-subtitle {
            margin-bottom: 22px;
            font-size: 12px;
            color: #777777;
        }
        .loading-bar {
            width: min(260px, 65vw);
            height: 3px;
            overflow: hidden;
            border-radius: 999px;
            background: #e8e8e8;
        }
        #loading-progress {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: #111111;
            transition: width 0.2s ease;
        }
        #loading-percent {
            margin-top: 10px;
            font-size: 11px;
            color: #888888;
            font-variant-numeric: tabular-nums;
        }

    
        #top-bar {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: min(900px, calc(100% - 40px));
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(0, 0, 0, 0.25);
            border-radius: 18px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 20;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        #top-bar button {
            border: none;
            background: transparent;
            color: #222;
            padding: 11px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
        }
        #top-bar button:hover {
            background: rgba(0, 0, 0, 0.07);
            transform: translateY(-1px);
        }

      
        #platform-wrap {
            position: absolute;
            top: 88px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
        }
        #platform-bar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.86);
            border: 1px solid rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .platform-link,
        .platform-button {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #222;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
        }
        .platform-link:hover,
        .platform-button:hover {
            background: rgba(0, 0, 0, 0.07);
            transform: translateY(-2px);
        }
        .platform-link svg,
        .platform-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

              
        #contact-popover {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 270px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.10);
            border-radius: 15px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.14);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease;
        }
        #contact-popover.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .contact-title {
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #777;
        }
        .contact-item {
            display: block;
            padding: 10px 11px;
            border-radius: 10px;
            color: #222;
            text-decoration: none;
            font-size: 13px;
            transition: background 0.2s ease;
        }
        .contact-item:hover {
            background: #f1f1f1;
        }
        .contact-item strong {
            display: block;
            margin-bottom: 3px;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

     
        :root {
            --axis-control-top: 82%;
        }
        #axis-control-wrap {
            position: absolute;
            top: var(--axis-control-top);
            right: 28px;
            transform: translateY(-50%);
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            background: transparent;
            border: none;
            box-shadow: none;
        }
        #axis-control {
            display: grid;
            grid-template-columns: 30px 30px 30px;
            grid-template-rows: 30px 30px;
            gap: 3px;
            align-items: center;
            justify-items: center;
        }
        .axis-button {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid currentColor;
            border-radius: 8px;
            background: transparent;
            color: #111111;
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            user-select: none;
            transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }
        .axis-button:hover {
            background: #111111;
            color: #ffffff;
            transform: scale(1.05);
        }
        .axis-button:active {
            transform: scale(0.94);
        }
        .axis-reset {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background: #111111;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .axis-reset:hover {
            transform: scale(1.08);
        }
        .axis-reset:active {
            transform: scale(0.92);
        }
        .axis-x-negative {
            grid-column: 1;
            grid-row: 2;
        }
        .axis-reset {
            grid-column: 2;
            grid-row: 2;
        }
        .axis-x-positive {
            grid-column: 3;
            grid-row: 2;
        }
        .axis-y-positive {
            grid-column: 2;
            grid-row: 1;
        }

       
        #theme-toggle {
            position: absolute;
            right: 24px;
            bottom: 24px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }
        #theme-toggle button {
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.25s ease, transform 0.25s ease;
        }
        #theme-toggle button:hover {
            background: rgba(0, 0, 0, 0.08);
            transform: scale(1.05);
        }
        #theme-label {
            font-size: 12px;
            font-weight: 600;
            padding-right: 4px;
        }

      
        #music-toggle {
            position: absolute;
            left: 24px;
            bottom: 24px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }
        #music-button {
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.25s ease, transform 0.25s ease;
        }
        #music-button:hover {
            background: rgba(0, 0, 0, 0.08);
            transform: scale(1.05);
        }
        #music-label {
            font-size: 12px;
            font-weight: 600;
            padding-right: 4px;
        }

      
        #modal-layer {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        #modal-layer.active {
            display: flex;
        }
        .modal {
            position: relative;
            width: min(850px, 94vw);
            max-height: 86vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.97);
            color: #111;
            border-radius: 24px;
            border: 1px solid rgba(0, 0, 0, 0.10);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.25);
            padding: 34px;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal-close {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: #eeeeee;
            cursor: pointer;
            font-size: 20px;
        }
        .modal-kicker {
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: #777;
        }
        .modal h2 {
            margin: 0 0 20px;
            font-size: clamp(28px, 5vw, 46px);
            line-height: 1.05;
        }
        .modal p {
            color: #555;
            line-height: 1.75;
            font-size: 15px;
        }

    
        .about-layout {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 30px;
            align-items: start;
        }
        .about-photo {
            width: 180px;
            height: 220px;
            object-fit: cover;
            border-radius: 18px;
            background: #eeeeee;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .about-name {
            margin-bottom: 5px;
            font-size: 20px;
            font-weight: 700;
        }
        .about-role {
            margin-bottom: 18px;
            color: #777;
            font-size: 14px;
        }

       
        .skill-group {
            margin-bottom: 24px;
        }
        .skill-group-title {
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #777;
        }
        .skill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .skill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: #f1f1f1;
            border-radius: 999px;
            font-size: 13px;
            color: #333;
        }
        .skill i {
            font-size: 15px;
            width: 1.1em;
            text-align: center;
            color: #444;
        }

      
        .project-list {
            display: grid;
            gap: 14px;
        }
        .project-card {
            padding: 22px;
            border-radius: 18px;
            background: #f6f6f6;
            border: 1px solid rgba(0, 0, 0, 0.07);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .project-number {
            margin-bottom: 8px;
            font-size: 11px;
            color: #888;
            letter-spacing: 0.1em;
        }
        .project-title {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: 700;
        }
        .project-description {
            margin-bottom: 14px;
            font-size: 14px;
            line-height: 1.65;
            color: #666;
        }
        .tech-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }
        .tech {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 11px;
            border-radius: 999px;
            background: #e8e8e8;
            font-size: 11px;
        }
        .tech i {
            font-size: 12px;
            width: 1em;
            text-align: center;
            color: #555;
        }
        .project-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .project-actions .action-group {
            display: flex;
            gap: 10px;
        }
        .project-link,
        .project-code,
        .project-status {
            display: inline-block;
            padding: 9px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
        }
        .project-link {
            background: #111;
            color: white;
        }
        .project-link:hover {
            transform: translateY(-1px);
            opacity: 0.88;
        }
        .project-code {
            background: #111;
            color: white;
        }
        .project-code:hover {
            transform: translateY(-1px);
            opacity: 0.88;
        }
        .project-status {
            background: #e8e8e8;
            color: #555;
            cursor: default;
        }
        .project-note {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            font-style: italic;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 10px;
        }

       
        .certificate-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .certificate {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 17px;
            border-radius: 15px;
            background: #f6f6f6;
            border: 1px solid rgba(0, 0, 0, 0.07);
        }
        .certificate-icon {
            font-size: 26px;
            width: 40px;
            text-align: center;
            flex-shrink: 0;
            color: #555;
        }
        .certificate-info strong {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .certificate-info span {
            color: #777;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .certificate-info span i {
            font-size: 13px;
            color: #888;
        }

      
        body.night,

        }

        body.night .axis-button {

        body.night .axis-button:hover {

        body.night #modal-layer {

        body.night .certificate-info span i {
            color: #888888;
        }

       
        @media (max-width: 768px) {
            #top-bar {
                top: 10px;
                width: calc(100% - 20px);
                min-height: 48px;
                gap: 2px;
                padding: 5px;
            }
            #top-bar button {
                flex: 1;
                padding: 9px 5px;
                font-size: 11px;
                white-space: nowrap;
            }
            #platform-wrap {
                top: 68px;
            }
            #platform-bar {
                gap: 3px;
                padding: 5px 6px;
            }
            .platform-link,
            .platform-button {
                width: 34px;
                height: 34px;
            }
            .platform-link svg,
            .platform-button svg {
                width: 18px;
                height: 18px;
            }
            #contact-popover {
                right: 50%;
                width: min(270px, 84vw);
                transform: translate(50%, -6px);
            }
            #contact-popover.active {
                transform: translate(50%, 0);
            }
            #axis-control-wrap {
                right: 12px;
                padding: 4px;
            }
            #axis-control {
                grid-template-columns: 27px 27px 27px;
                grid-template-rows: 27px 27px;
                gap: 2px;
            }
            .axis-button {
                width: 27px;
                height: 27px;
                border-radius: 7px;
                font-size: 10px;
            }
            .axis-reset {
                width: 24px;
                height: 24px;
                font-size: 12px;
            }
            #theme-toggle {
                right: 12px;
                bottom: 12px;
            }
            #music-toggle {
                left: 12px;
                bottom: 12px;
            }
            #theme-label,
            #music-label {
                display: none;
            }
            #modal-layer {
                padding: 12px;
            }
            .modal {
                width: 100%;
                max-height: 90vh;
                padding: 25px 20px;
                border-radius: 20px;
            }
            .about-layout {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            .about-photo {
                width: 120px;
                height: 145px;
            }
            .certificate-list {
                grid-template-columns: 1fr;
            }
            .project-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .project-actions .action-group {
                justify-content: center;
            }
        }
    </style>

<body>

   
    <div id="loading-screen">
        <div class="loading-title">Loading experience</div>
        <div class="loading-subtitle">Preparing the 3D environment…</div>
        <div class="loading-bar">
            <div id="loading-progress"></div>
        </div>
